name: Kakao Daily Summary

# Vercel Hobby cron 한도(2개) 안에 못 들어가서 GitHub Actions로 처리.
# 21:00 KST = 12:00 UTC
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger kakao-daily-summary endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret이 설정 안 됨. Settings → Secrets → Actions에서 추가 필요."
            exit 1
          fi
          response=$(curl -fsS -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://aftermind-checkmate.vercel.app/api/cron/kakao-daily-summary)
          echo "$response"
